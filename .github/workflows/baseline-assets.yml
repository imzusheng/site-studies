name: Baseline Club asset preparation
on:
  push:
    branches: [feat/court-study-cypress-rc1]
    paths: ['.github/workflows/baseline-assets.yml', 'baseline-club/tools/asset-audit.py']
permissions:
  contents: read
concurrency:
  group: baseline-assets
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Blender Foundation Python module
        run: python -m pip install --disable-pip-version-check 'bpy==4.2.0' 'numpy==1.26.4'
      - name: Download and verify authorized artist sources
        run: |
          python - <<'PY'
          import urllib.request, pathlib, hashlib, zipfile, json
          out=pathlib.Path('asset-audit');out.mkdir(exist_ok=True)
          sources=[('rain','https://studio.blender.org/download-source/files/ee/a7/eea73e55dba1cea31c09848df6a794b2-4.zip','80217f163f6392dc829233d63c2cfb5e1376775bc34101ad14f39631fea70d24'),('snow','https://studio.blender.org/download-source/files/ba/0f/ba0fe6d810333b1d73c1c359e4dc03cb-6.zip','98d58ef3a07083ede14140bc462cccb55d317062846aa0eb652d2e4a7ac422a6')]
          receipts=[]
          for name,url,expected in sources:
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
            with urllib.request.urlopen(req,timeout=60) as r: data=r.read(180*1024*1024)
            digest=hashlib.sha256(data).hexdigest();assert digest==expected, 'Artist source changed'
            p=out/(name+'.zip');p.write_bytes(data)
            with zipfile.ZipFile(p) as z:
              target=(out/name).resolve();target.mkdir(exist_ok=True)
              for entry in z.infolist():
                if not (target/entry.filename).resolve().is_relative_to(target):raise ValueError('Unsafe ZIP entry')
              z.extractall(target)
            receipts.append({'name':name,'source':url,'bytes':len(data),'sha256':digest})
          (out/'source-receipts.json').write_text(json.dumps(receipts,indent=2));print(json.dumps(receipts,indent=2))
          motions=out/'motion';motions.mkdir(exist_ok=True)
          commit='9af88bb4df4e78b22127719744fdca993ced2733'
          for name in ['lvargas_Derecha_4seg.bvh','adorozco_Reves_8seg.bvh','lvargas_Servicio_21seg.bvh','lvargas_Remate.bvh','lvargas_VDerecha.bvh','lvargas_VReves.bvh']:
            urllib.request.urlretrieve('https://raw.githubusercontent.com/jdpulgarin/Tennis-MoCap/'+commit+'/data/'+name,motions/name)
          PY
      - name: Inspect and export native game candidates
        run: timeout 600 python baseline-club/tools/asset-audit.py
      - name: Upload compact candidate assets and metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: baseline-character-candidates
          path: |
            asset-audit/*.json
            asset-audit/*.glb
            asset-audit/motion/
          retention-days: 3
      - name: Preserve licensed artist source cache
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: baseline-artist-sources
          path: asset-audit/*.zip
          compression-level: 0
          retention-days: 3
