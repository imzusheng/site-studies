name: Baseline UV audit
on:
  push:
    branches: [feat/court-study-cypress-rc1]
    paths: ['.github/workflows/baseline-uv.yml']
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python -m pip install 'bpy==4.5.13' 'numpy==1.26.4'
      - uses: actions/download-artifact@v4
        with:
          name: baseline-artist-sources
          run-id: 34742416840
          github-token: ${{ github.token }}
          path: originals
      - run: |
          python - <<'PY'
          import zipfile,pathlib
          with zipfile.ZipFile('originals/snow.zip') as z:z.extractall('source')
          PY
          python - <<'PY'
          import bpy,pathlib,runpy,json
          f=next(pathlib.Path('source').rglob('*.blend'));bpy.ops.wm.open_mainfile(filepath=str(f.resolve()),use_scripts=False)
          result=runpy.run_path('baseline-club/tools/inspect-uv.py')['inspect_uv'](bpy)
          pathlib.Path('uv-audit.json').write_text(json.dumps(result,indent=2));print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: baseline-uv-audit, path: uv-audit.json, retention-days: 3}
