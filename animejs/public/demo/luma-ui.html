<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luma Remote 界面交互预览</title><style>
:root{--page:#e9e9e7;--panel:#f5f5f3;--ink:#171819;--muted:#73777b;--lcd:#0b0c0d;--surface:#151719;--surface2:#202326;--line:#2c3034;--text:#f4f3ef;--sub:#9ca1a6;--accent:#f3a93c;--good:#72cb8b;--warn:#e3b24f;--bad:#e47768;--warm:#ffb457;--cool:#bcd9ff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--page);color:var(--ink);font:14px/1.4 system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.page{max-width:1180px;margin:auto;padding:28px 24px 44px}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:20px}h1{margin:0 0 7px;font-size:24px;letter-spacing:-.035em}.top p{margin:0;max-width:70ch;color:var(--muted)}.badge{border:1px solid #c8c8c5;border-radius:999px;background:#f3f3f1;padding:7px 10px;font:650 11px ui-monospace,SFMono-Regular,Menlo,monospace;color:#555;white-space:nowrap}.workbench{display:grid;grid-template-columns:minmax(0,1fr) 292px;gap:22px;align-items:start}.device-wrap{min-height:596px;display:grid;place-items:center;border:1px solid #d2d2cf;background:var(--panel);border-radius:20px;padding:24px}.device{width:704px;max-width:100%;aspect-ratio:4/3;padding:15px;border-radius:24px;background:#050505;box-shadow:0 18px 45px rgba(0,0,0,.16)}.lcd{position:relative;width:100%;height:100%;overflow:hidden;background:var(--lcd);color:var(--text);border-radius:12px;user-select:none;container-type:inline-size}.header{height:15%;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;padding:0 4.2%;border-bottom:1px solid var(--line)}.header-main{min-width:0;display:flex;align-items:center;gap:2cqw}.title{font-size:5.45cqw;font-weight:730;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sync{display:flex;align-items:center;gap:1.15cqw;font-size:3.45cqw;color:var(--sub);white-space:nowrap}.sync .dot{width:1.5cqw;height:1.5cqw;border-radius:50%}.sync.live .dot{background:var(--good)}.sync.stale{color:var(--warn)}.sync.stale .dot{background:var(--warn)}.sync.offline{color:var(--bad)}.sync.offline .dot{background:var(--bad)}.back{height:8.1cqw;display:inline-flex;align-items:center;gap:1cqw;padding:0 1.7cqw;border-radius:2cqw;color:var(--sub);font-size:3.55cqw;font-weight:650}.back.focused{background:var(--surface2);color:var(--text);box-shadow:inset 3px 0 0 var(--accent)}.back b{font-size:5.1cqw;line-height:1;font-weight:500}.footer{height:12%;display:flex;align-items:center;padding:0 4.5%;border-top:1px solid var(--line);font-size:3.35cqw;color:var(--sub)}.footer .hint{margin-left:auto;color:#7f8489;white-space:nowrap}.home{height:73%;padding:1.3% 2.5% 0}.light,.preset-entry{position:relative;height:16.05%;border-radius:7px;color:var(--sub);padding:0 3.7%}.light{display:flex;flex-direction:column;justify-content:center;gap:2px}.light+.light,.preset-entry{border-top:1px solid rgba(255,255,255,.035)}.light.selected,.preset-entry.selected,.setting.selected,.preset.selected{background:var(--surface2);color:var(--text)}.selected:before{content:"";position:absolute;left:0;top:18%;bottom:18%;width:3px;border-radius:2px;background:var(--accent)}.row{display:grid;grid-template-columns:17px minmax(0,1fr) auto;align-items:center}.state{width:7px;height:7px;border-radius:50%;background:#70757a}.state.on{background:var(--good)}.state.off{border:1px solid #7a8085;background:transparent}.state.bad{background:var(--bad)}.name{font-size:3.95cqw;font-weight:590;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.value{font:650 3.7cqw ui-monospace,SFMono-Regular,Menlo,monospace;color:#d8dadd}.track{height:2px;margin-left:25px;border-radius:2px;background:rgba(255,255,255,.08)}.fill{height:100%;border-radius:2px;background:var(--accent)}.preset-entry{height:19.75%;display:grid;grid-template-columns:17px minmax(0,1fr) auto;align-items:center}.preset-icon{width:7px;height:7px;border-radius:2px;background:var(--accent)}.arrow{font-size:5cqw;color:#777d82}.detail{height:73%;padding:1.5% 2.7%}.setting{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;padding:0 4%;border-radius:7px;color:var(--sub)}.setting+.setting{border-top:1px solid rgba(255,255,255,.035)}.setting.two{display:flex;flex-direction:column;justify-content:center;gap:4px}.detail-top{width:100%;display:flex;align-items:center;justify-content:space-between}.setting-name{font-size:4cqw;font-weight:590}.setting-value{font:650 3.9cqw ui-monospace,SFMono-Regular,Menlo,monospace;color:#d9dbdc}.setting.editing .setting-value{color:var(--accent);font-size:4.55cqw}.bar,.ct{position:relative;width:100%;height:1.45cqw;border-radius:1cqw;background:rgba(255,255,255,.08)}.bar>i{display:block;height:100%;border-radius:1cqw;background:var(--accent)}.ct{background:linear-gradient(90deg,var(--warm),var(--cool))}.ct i{position:absolute;top:50%;width:2.5cqw;height:2.5cqw;border-radius:50%;background:#fff;border:2px solid var(--ink);transform:translate(-50%,-50%)}.pills{display:flex;gap:1.1cqw;width:100%}.pill{flex:1;border:1px solid var(--line);border-radius:999px;padding:.7cqw 0;text-align:center;font-size:2.95cqw;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pill.active{background:var(--accent);border-color:var(--accent);color:#171819;font-weight:720}.switch{position:relative;width:9cqw;height:4.35cqw;border-radius:999px;background:#3a3d40}.switch.on{background:var(--good)}.switch i{position:absolute;top:.5cqw;left:.5cqw;width:3.35cqw;height:3.35cqw;border-radius:50%;background:#fff}.switch.on i{transform:translateX(4.15cqw)}.presets{height:73%;padding:1.8% 3%}.preset{position:relative;height:16.2%;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;padding:0 4%;border-radius:7px;color:var(--sub)}.preset+.preset{border-top:1px solid rgba(255,255,255,.035)}.preset-name{font-size:3.95cqw;font-weight:610}.preset small{color:#777d82;font-size:2.8cqw}.keycap{border:1px solid var(--line);border-radius:1.5cqw;padding:.45cqw 1cqw;font:700 3.05cqw ui-monospace,SFMono-Regular,Menlo,monospace;color:#8f9499}.preset.all-off .preset-name{color:#e9b2aa}.system{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2cqw;text-align:center;padding:0 9%}.sys-icon{width:9cqw;height:9cqw;border-radius:50%;border:.8cqw solid var(--line);border-top-color:var(--accent);animation:spin .9s linear infinite}.sys-title{font-size:5.5cqw;font-weight:720}.sys-sub{max-width:82%;font-size:3.8cqw;color:var(--sub)}.sys-status{position:absolute;left:0;right:0;bottom:7%;text-align:center;color:#7f8489;font-size:3.25cqw}@keyframes spin{to{transform:rotate(360deg)}}.toast{position:absolute;left:50%;bottom:14%;transform:translateX(-50%);opacity:0;background:#e9e8e3;color:#171819;border-radius:999px;padding:5px 10px;font-size:3.2cqw;font-weight:680;box-shadow:0 6px 18px rgba(0,0,0,.25);transition:opacity .14s;pointer-events:none;white-space:nowrap}.toast.show{opacity:1}.toast.key{background:var(--accent)}.toast.bad{background:var(--bad)}.controls{border:1px solid #d2d2cf;background:var(--panel);border-radius:18px;padding:18px}.controls h2{font-size:15px;margin:0 0 5px}.controls p{margin:0 0 14px;color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ctrl{border:1px solid #cbcbd0;background:#fff;border-radius:10px;padding:10px 8px;color:#282a2c;font:600 12px system-ui;cursor:pointer}.ctrl.wide{grid-column:1/-1}.shortcuts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.shortcut{border:1px solid #cbcbd0;background:#fff;border-radius:10px;padding:9px 3px;text-align:center;cursor:pointer}.shortcut b{display:block;font:700 15px ui-monospace,SFMono-Regular,Menlo,monospace}.shortcut small{font-size:9px;color:#777b7f}.legend{margin-top:14px;padding-top:12px;border-top:1px solid #ddd;color:var(--muted);font-size:11px}.legend code{background:#ecece9;border-radius:5px;padding:2px 4px}.notes{margin-top:20px;border:1px solid #d2d2cf;background:var(--panel);border-radius:14px;padding:18px 20px}.notes h2{margin:0 0 9px;font-size:15px}.notes ul{margin:0;padding-left:18px;color:#3a3c3e;font-size:12.5px;line-height:1.65}@media(max-width:900px){.workbench{grid-template-columns:1fr}.device-wrap{min-height:auto}.controls{max-width:704px;width:100%;margin:auto}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

html,body{width:100%;height:100%;min-height:0;background:#0b0c0d;overflow:hidden}.lcd{border-radius:0}.toast{font-size:3.2cqw}.row{grid-template-columns:3cqw minmax(0,1fr) auto}.state{width:1.2cqw;height:1.2cqw}.track{margin-left:3cqw}.preset-entry{grid-template-columns:3cqw minmax(0,1fr) auto}
</style></head><body><div class="lcd" id="lcd" role="region" aria-label="Luma 320×240 横屏界面"></div><script>
const lights=[
{name:'客厅主灯',on:true,bri:72,ct:3800,effects:['阅读','放松','夜灯'],effect:'阅读',available:true},
{name:'沙发落地灯',on:true,bri:36,ct:3000,effects:[],effect:'',available:true},
{name:'餐桌吊灯',on:false,bri:55,ct:3400,effects:['烛光','柔和'],effect:'柔和',available:true},
{name:'卧室床头灯',on:true,bri:18,ct:2700,effects:['呼吸','夜灯'],effect:'夜灯',available:true},
{name:'玄关灯',on:false,bri:0,ct:3200,effects:[],effect:'',available:false}
];
const globalPresets=[
{name:'日常',sub:'Scene 1 · HA 名称'},
{name:'氛围',sub:'Scene 2 · HA 名称'},
{name:'睡眠',sub:'Scene 3 · HA 名称'},
{name:'场景 4',sub:'Scene 4 · 由 HA/配置命名'},
{name:'全部打开',sub:'All On'},
{name:'全部关闭',sub:'All Off',off:true}
];
let mode='home',syncState='live',homeFocus=0,detailFocus=0,presetFocus=0,editing=false,toastTimer=0;
const lcd=document.querySelector('#lcd');
function sync(){return `<span class="sync ${syncState}"><span class="dot"></span>${syncState==='live'?'已同步':syncState==='stale'?'同步延迟':'离线'}</span>`}
function backHeader(title,focused){return `<div class="header"><div class="header-main"><span class="back ${focused?'focused':''}"><b>‹</b> 灯光</span><span class="title">${title}</span></div>${sync()}</div>`}
function footer(context,hint){return `<div class="footer"><span>${context}</span><span class="hint">${hint}</span></div><div class="toast" id="toast"></div>`}
function ctPct(v){return Math.max(0,Math.min(100,(v-2700)/(6500-2700)*100))}
function rowsFor(l){const a=['power','bri','ct'];if(l.effects.length)a.push('effect');return a}
function renderHome(){const p=homeFocus===lights.length;const l=p?null:lights[homeFocus];lcd.innerHTML=`<div class="header"><div class="header-main"><span class="title">灯光</span></div>${sync()}</div><div class="home">${lights.map((x,i)=>`<div class="light ${i===homeFocus?'selected':''}"><div class="row"><span class="state ${!x.available?'bad':x.on?'on':'off'}"></span><span class="name">${x.name}</span><span class="value">${!x.available?'离线':x.on?x.bri+'%':'关闭'}</span></div>${x.available?`<div class="track"><div class="fill" style="width:${x.on?x.bri:0}%"></div></div>`:''}</div>`).join('')}<div class="preset-entry ${p?'selected':''}"><span class="preset-icon"></span><span class="name">全局预设</span><span class="arrow">›</span></div></div>${footer(p?'Scene 1–4 · 全开 · 全关':!l.available?'暂不可用':l.on?`${l.ct}K${l.effect?' · '+l.effect:''}`:'已关闭','旋转选择 · 按下进入')}`}
function settingHtml(l,key,i,n){const selected=detailFocus===i,edit=editing&&selected,h=100/n;if(key==='power')return `<div class="setting ${selected?'selected':''}" style="height:${h}%"><span class="setting-name">开关</span><span class="switch ${l.on?'on':''}"><i></i></span></div>`;if(key==='bri')return `<div class="setting two ${selected?'selected':''} ${edit?'editing':''}" style="height:${h}%"><div class="detail-top"><span class="setting-name">亮度</span><span class="setting-value">${l.bri}%</span></div><div class="bar"><i style="width:${l.bri}%"></i></div></div>`;if(key==='ct')return `<div class="setting two ${selected?'selected':''} ${edit?'editing':''}" style="height:${h}%"><div class="detail-top"><span class="setting-name">色温</span><span class="setting-value">${l.ct}K</span></div><div class="ct"><i style="left:${ctPct(l.ct)}%"></i></div></div>`;return `<div class="setting two ${selected?'selected':''} ${edit?'editing':''}" style="height:${h}%"><div class="detail-top"><span class="setting-name">效果</span><span class="setting-value">${l.effect}</span></div><div class="pills">${l.effects.map(x=>`<span class="pill ${x===l.effect?'active':''}">${x}</span>`).join('')}</div></div>`}
function renderDetail(){const l=lights[homeFocus],rows=rowsFor(l);detailFocus=Math.min(detailFocus,rows.length-1);lcd.innerHTML=`${backHeader(l.name,!editing&&detailFocus===-1)}<div class="detail">${rows.map((r,i)=>settingHtml(l,r,i,rows.length)).join('')}</div>${footer(editing?'编辑模式':'灯光设置',editing?'旋转调节 · 按下完成 · 长按退出':'旋转选择 · 按下执行 · 长按返回')}`}
function renderPresets(){lcd.innerHTML=`${backHeader('全局预设',presetFocus===-1)}<div class="presets">${globalPresets.map((p,i)=>`<div class="preset ${i===presetFocus?'selected':''} ${p.off?'all-off':''}"><div><div class="preset-name">${p.name}</div><small>${p.sub}</small></div><span class="keycap">K${i+1}</span></div>`).join('')}</div>${footer('六个全局动作','旋转选择 · 按下执行 · 长按返回')}`}
function renderSystem(kind){const data=kind==='provision'?['尚未连网','请连接 Luma 设置热点完成配网','AP 广播中']:['首次连接','正在连接 Home Assistant 并获取五灯状态…','等待第一份权威快照'];lcd.innerHTML=`<div class="system"><div class="sys-icon"></div><div class="sys-title">${data[0]}</div><div class="sys-sub">${data[1]}</div></div><div class="sys-status">${data[2]}</div>`}
function render(){if(mode==='provision'||mode==='connecting')return renderSystem(mode);if(mode==='detail')return renderDetail();if(mode==='presets')return renderPresets();renderHome()}
function toast(text,kind=''){const el=document.querySelector('#toast');if(!el)return;clearTimeout(toastTimer);el.textContent=text;el.className='toast show '+kind;toastTimer=setTimeout(()=>el.className='toast',1200)}
function rotate(d){if(mode==='home'){homeFocus=Math.max(0,Math.min(lights.length,homeFocus+d));return render()}if(mode==='presets'){presetFocus=Math.max(-1,Math.min(globalPresets.length-1,presetFocus+d));return render()}if(mode!=='detail')return;const l=lights[homeFocus],rows=rowsFor(l);if(!editing){detailFocus=Math.max(-1,Math.min(rows.length-1,detailFocus+d));return render()}const key=rows[detailFocus];if(key==='bri')l.bri=Math.max(1,Math.min(100,l.bri+d*5));if(key==='ct')l.ct=Math.max(2700,Math.min(6500,l.ct+d*100));if(key==='effect'){let n=l.effects.indexOf(l.effect);l.effect=l.effects[(n+d+l.effects.length)%l.effects.length]}render()}
function goHome(){mode='home';editing=false;detailFocus=0;presetFocus=0;render()}
function executePreset(i){if(syncState==='offline')return toast('当前离线，未执行','bad');toast(`已执行 · ${globalPresets[i].name}`,'key');setTimeout(goHome,500)}
function press(){if(mode==='home'){if(homeFocus===lights.length){mode='presets';presetFocus=0;return render()}const l=lights[homeFocus];if(!l.available)return toast('设备暂不可用','bad');mode='detail';detailFocus=0;editing=false;return render()}if(mode==='presets'){if(presetFocus===-1)return goHome();return executePreset(presetFocus)}if(mode!=='detail')return;const l=lights[homeFocus],rows=rowsFor(l);if(editing){editing=false;render();return toast('已更新')}if(detailFocus===-1)return goHome();const key=rows[detailFocus];if(key==='power'){if(syncState==='offline')return toast('当前离线，未发送','bad');l.on=!l.on;render();return toast(l.on?'已开启':'已关闭')}if(syncState==='offline')return toast('当前离线，无法编辑','bad');editing=true;render()}
function longPress(){if(mode==='detail'){if(editing){editing=false;return render()}return goHome()}if(mode==='presets')goHome()}
function shortcut(i){if(!['home','detail','presets'].includes(mode))return;mode='home';editing=false;render();executePreset(i)}

function notify(){parent.postMessage({type:'luma-demo-state',mode,editing,focus:homeFocus,brightness:lights[homeFocus]?.bri},'*')}
const originalRender=render;
render=function(){originalRender();notify()};
window.addEventListener('message',event=>{
  if(event.source!==parent||event.data?.type!=='luma-demo-command')return;
  const {action,value}=event.data;
  if(action==='rotate'&&(value===1||value===-1))rotate(value);
  else if(action==='press')press();
  else if(action==='long')longPress();
  else if(action==='preset'&&Number.isInteger(value)&&value>=0&&value<6)shortcut(value);
  else if(action==='home')goHome();
  else if(action==='tour'){
    homeFocus=0;goHome();
    if(value==='brightness'){press();rotate(1);press()}
    else if(value==='temperature'){press();rotate(1);rotate(1);press()}
    else if(value==='presets'){for(let i=0;i<lights.length;i++)rotate(1);press()}
  }
});
render();parent.postMessage({type:'luma-demo-ready'},'*');
</script></body></html>
